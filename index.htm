<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="/script.js" defer></script>
    <title>Jokenpô</title>
</head>
<body>

    <main class="container">

        <h1 class="title">Jokenpô</h1>

        <section class="section">

            <button class="stone" onclick="playHuman ('stone')">&#x270A</button>
            <button class="paper" onclick="playHuman ('paper')">&#x1F590</button>
            <button class="scissors" onclick="playHuman ('scissors')">&#x270C</button>

        </section>

        <p class="result"></p>

        <p class="myScore">Sua Pontuação: <span class="humanScore">0</span></p>
        <p class="machineScore">Pontuação da Máquina: <span class="scoringMachine">0</span></p>
    </main>
    
</body>
</html>
